<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Recipes AI | S3ebaz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-stone-100 min-h-screen font-sans text-stone-800">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="text-center mb-12">
      <h1 class="text-5xl font-serif font-bold text-amber-900 mb-2">☕ Coffee Recipes AI</h1>
      <p class="text-lg text-stone-600">Sube o toma fotos de tu café y receta.</p>
      <p class="text-sm text-amber-700 mt-2">Repositorio: S3ebaz/coffee-recipes</p>
    </header>

    <!-- Upload Area -->
    <section class="grid md:grid-cols-2 gap-6 mb-8">
      <div class="upload-zone border-2 border-dashed border-amber-400 rounded-2xl p-6 text-center bg-white/70 hover:bg-amber-50 transition" id="packagingZone">
        <h3 class="font-serif text-xl text-amber-900 mb-2">📦 Empaque de Café</h3>
        <p class="text-sm text-stone-600 mb-4">Arrastra, selecciona o toma una foto del empaque</p>
        <input type="file" id="packagingInput" accept="image/*" class="hidden">
        <input type="file" id="packagingCamera" accept="image/*" capture="environment" class="hidden">
        <div class="flex flex-col sm:flex-row gap-2 justify-center">
          <button class="select-btn px-4 py-2 bg-amber-600 text-white rounded-lg text-sm" data-target="packagingInput">Seleccionar</button>
          <button class="select-btn px-4 py-2 bg-amber-700 text-white rounded-lg text-sm" data-target="packagingCamera">Tomar Foto</button>
        </div>
        <img id="packagingPreview" class="mt-4 mx-auto max-h-48 rounded-lg shadow hidden">
      </div>
      <div class="upload-zone border-2 border-dashed border-amber-400 rounded-2xl p-6 text-center bg-white/70 hover:bg-amber-50 transition" id="recipeZone">
        <h3 class="font-serif text-xl text-amber-900 mb-2">📝 Receta / Método Actual</h3>
        <p class="text-sm text-stone-600 mb-4">Arrastra, selecciona o toma una foto de tu receta</p>
        <input type="file" id="recipeInput" accept="image/*" class="hidden">
        <input type="file" id="recipeCamera" accept="image/*" capture="environment" class="hidden">
        <div class="flex flex-col sm:flex-row gap-2 justify-center">
          <button class="select-btn px-4 py-2 bg-amber-600 text-white rounded-lg text-sm" data-target="recipeInput">Seleccionar</button>
          <button class="select-btn px-4 py-2 bg-amber-700 text-white rounded-lg text-sm" data-target="recipeCamera">Tomar Foto</button>
        </div>
        <img id="recipePreview" class="mt-4 mx-auto max-h-48 rounded-lg shadow hidden">
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
